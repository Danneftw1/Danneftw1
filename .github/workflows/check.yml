# Keeps the one law this repo has: the profile has to look right on a phone,
# in both of GitHub's themes, in the light-on-dark fallback the mobile apps
# show, and with motion off. The check draws the README's own image blocks at
# 390, 430 and 896 px in all four and reads README.md for alt text, paired
# sources and third-party images.
#
# It deliberately does not rebuild the SVGs. The build fetches fonts from
# Google's CDN, and a CDN hiccup should never turn this red — the generated
# files are committed, so what CI sees is what GitHub will serve.
name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tools/out/*.png
          if-no-files-found: warn
