# Keeps the laws this repo has. Two jobs' worth of proof in one:
#
#   build   rebuilds every asset from tools/build-assets.py with the committed
#           fonts and fails if the result differs from what is committed — so
#           a hand-edited SVG, or a generator change without a rebuild, is red.
#           The palette's contrast and colour-blind checks run inside it.
#   check   draws the README's own image blocks at 390, 430 and 896 px in both
#           themes, in the light-on-dark view the GitHub apps show, and with
#           motion off; lints the page's words, numbers, links and headings;
#           and proves each static file is a true frame of its moving twin.
name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: npm run build
      - run: git diff --exit-code -- assets/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tools/out/*.png
          if-no-files-found: warn
