<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 664" width="1100" height="664" role="img" aria-labelledby="t d" fill="none" data-now-year="2026" data-drums-from="2009" data-still-at="12.9297">
<title id="t">Daniel Nilsson — LLM engineering, full-stack, Göteborg</title>
<desc id="d">Daniel Nilsson — LLM engineering, full-stack, Göteborg. A custom mechanical keyboard in cream and slate on a rain-blue case: the name on the letter keys, the role on the modifiers, and the spacebar held down and lit, reading INNOVATION DEVELOPER · QUOKKA, beside a lit NOW key.</desc>
